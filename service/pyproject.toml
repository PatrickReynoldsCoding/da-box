[project]
name = "dabox"
version = "0.1.0"
description = "Kids TV box: box service, admin app and player agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dabox-service = "dabox.main:run_service"
dabox-agent = "dabox.agent.main:run_agent"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dabox*"]

[tool.setuptools.package-data]
dabox = ["admin_web/*", "agent/*.conf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
