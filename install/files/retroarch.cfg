# RetroArch for da-box. Written by install/install.sh. The kid user cannot change it.
# Debian's /etc/retroarch.cfg is not read (--config replaces it), so its paths are here.
# RetroArch matches the running core to its info file by scanning libretro_directory.
# Without both, it thinks no core can save states.
libretro_directory = "@CORE_DIR@"
libretro_info_path = "/usr/share/libretro/info/"
assets_directory = "/usr/share/libretro/assets/"
cache_directory = "/tmp"
history_list_enable = "false"
audio_driver = "alsa"

video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_font_enable = "true"

# Kiosk: no menu, no settings, no way out except quitting the game.
kiosk_mode_enable = "true"
kiosk_mode_password = "@KIOSK_PASSWORD@"
config_save_on_exit = "false"
quit_press_twice = "false"
pause_nonactive = "false"
input_menu_toggle = "nul"
input_menu_toggle_gamepad_combo = "0"
input_toggle_fullscreen = "nul"
input_save_state = "nul"
input_load_state = "nul"
input_state_slot_increase = "nul"
input_state_slot_decrease = "nul"
input_screenshot = "nul"
input_cheat_toggle = "nul"
input_netplay_game_watch = "nul"
input_game_focus_toggle = "nul"

# Leave a game: Esc on the keyboard, Start + Select on a controller.
input_exit_emulator = "escape"
input_quit_gamepad_combo = "4"
input_autodetect_enable = "true"

# The agent sends SAVE_STATE before QUIT. Slot -1 is the "auto" slot, which
# savestate_auto_load loads when the game opens again.
state_slot = "-1"
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "false"

# The agent sends QUIT and SHOW_MSG here. The firewall keeps it local.
network_cmd_enable = "true"
network_cmd_port = "55355"

# No online features.
menu_show_online_updater = "false"
menu_show_core_updater = "false"
core_updater_buildbot_cores_url = ""
core_updater_buildbot_assets_url = ""
network_on_demand_thumbnails = "false"
cheevos_enable = "false"
discord_allow = "false"
netplay_public_announce = "false"
