# Allow-list proxy for the da-box service (metadata and art). Only the tvbox user
# and root may connect (see nftables.conf); only the sites in dabox-filter are allowed.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 60
MaxClients 20
LogLevel Warning
DisableViaHeader Yes
Filter "/etc/tinyproxy/dabox-filter"
FilterType ere
FilterURLs No
FilterDefaultDeny Yes
ConnectPort 443
